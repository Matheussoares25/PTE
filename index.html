<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PTE</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="style/styleNAVBAR.css">
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="style/index.css">


</head>

<body>


    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <a class="navbar-brand fw-bold text-white" href="#" style="font-size:22px;">
                <i class="bi bi-mortarboard-fill me-1"></i> PTE
            </a>
           

        </div>

    </nav>

    <div class="login-card">

        <div class="logo-circle">
            <div class="logo-inner">PTE</div>
        </div>


        <h4 class="title-login">Login</h4>

        <form class="col" id="login" method="POST">
            <div class="mb-3">
                <label for="Nome" class="form-label">Nome</label>
                <input type="text" class="form-control" id="Email" placeholder="email de Usuário" required>
            </div>

            <div class="mb-3">
                <label for="senha" class="form-label">Senha</label>
                <input type="password" class="form-control" id="senha" placeholder="Senha de acesso" required>
            </div>

            <p id="Resposta"></p>

            <button type="submit" class="btn btn-primary">Login</button>

        </form>
    </div>


</body>

</html>


<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
